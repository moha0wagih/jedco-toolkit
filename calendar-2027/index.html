:root{
  --bg:#F3F6FA; --surface:#FFFFFF; --cell:#FFFFFF; --cell-off:#F7F9FC; --weekend:#EEF6FD;
  --ink:#002657; --ink-soft:#4A618A; --accent:#004EAA; --accent-ink:#FFFFFF; --sky:#62B6F3;
  --hijri:#6F93C6; --line:#D9E2EE; --logo:#004EAA; --warn:#B4490F;
  --display:"Sequel","Arial Black",Arial,sans-serif;
  --body:"FS Industrie",Arial,Helvetica,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#00142F; --surface:#001D45; --cell:#002657; --cell-off:#001A3E; --weekend:#063269;
  --ink:#FFFFFF; --ink-soft:#B4C6E2; --accent:#62B6F3; --accent-ink:#00142F; --sky:#62B6F3;
  --hijri:#8FB5E6; --line:#123A70; --logo:#FFFFFF; --warn:#FFB38A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#00142F; --surface:#001D45; --cell:#002657; --cell-off:#001A3E; --weekend:#063269;
  --ink:#FFFFFF; --ink-soft:#B4C6E2; --accent:#62B6F3; --accent-ink:#00142F; --sky:#62B6F3;
  --hijri:#8FB5E6; --line:#123A70; --logo:#FFFFFF; --warn:#FFB38A; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.4}
.wrap{max-width:1760px;margin:0 auto;padding-block:22px 28px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:18px}

/* header */
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.brand svg{display:block;height:46px;width:auto}
.brand svg *{fill:var(--logo)}
.year{text-align:right;display:flex;flex-direction:column;gap:2px}
.year b{font-family:var(--display);font-weight:700;font-size:40px;line-height:1;color:var(--ink)}
.year span{font-size:12.5px;color:var(--ink-soft)}
.year span i{font-style:normal;font-family:var(--display);font-size:11px}

.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;
  border-top:1px solid var(--line);padding-top:14px}
.hint{color:var(--ink-soft);font-size:13px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;min-width:0}
.status{display:inline-flex;align-items:center;gap:6px;color:var(--ink-soft)}
.status::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--sky)}
.status[data-s="saving"]::before{background:var(--hijri);animation:pulse 1s ease-in-out infinite}
.status[data-s="warn"]{color:var(--warn)}
.status[data-s="warn"]::before{background:var(--warn)}
@keyframes pulse{50%{opacity:.25}}
.acts{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.msg{font-size:12.5px;color:var(--ink-soft)}
.msg[data-s="warn"]{color:var(--warn)}
.btn{font:inherit;font-size:13.5px;border:0;border-radius:10px;padding:10px 16px;cursor:pointer;
  background:var(--accent);color:var(--accent-ink);display:inline-flex;align-items:center;gap:8px}
.btn svg{width:16px;height:16px;flex:none}
.btn:hover{filter:brightness(1.08)}
.btn:disabled{opacity:.55;cursor:default;filter:none}
.btn:focus-visible{outline:2px solid var(--sky);outline-offset:2px}

/* months */
.months{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;align-items:start}
@media (max-width:1180px){.months{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:760px){.months{grid-template-columns:minmax(0,1fr)}}
.month{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;
  display:flex;flex-direction:column;min-width:0}
.mh{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding:13px 14px 10px}
.mh h2{margin:0;font-family:var(--display);font-weight:700;font-size:17px;color:var(--ink)}
.mh span{font-size:11.5px;color:var(--hijri);text-align:right;min-width:0}
.dow{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-top:2px solid var(--accent)}
.dow span{font-size:10.5px;color:var(--accent);padding:6px 0 5px 7px;text-transform:uppercase}
.dow span.we{color:var(--hijri)}
.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));grid-auto-rows:minmax(70px,auto);gap:1px;
  background:var(--line);border-top:1px solid var(--line);flex:1}
.d{background:var(--cell);display:flex;flex-direction:column;min-width:0;position:relative}
.d.we{background:var(--weekend)}
.d.off{background:var(--cell-off)}
.d:focus-within{outline:2px solid var(--accent);outline-offset:-2px;z-index:1}
.dn{display:flex;align-items:baseline;justify-content:space-between;gap:4px;padding:6px 7px 0}
.dn b{font-family:var(--display);font-weight:400;font-size:14px;line-height:1;color:var(--ink);font-variant-numeric:tabular-nums}
.dn i{font-style:normal;font-family:var(--display);font-size:8.5px;line-height:1;color:var(--hijri);white-space:nowrap}
.dn i em{font-style:normal;font-family:var(--body);font-size:9.5px;margin-left:3px}
.d textarea{flex:1;width:100%;min-height:42px;border:0;margin:0;background:transparent;color:var(--ink);
  font-family:var(--body);font-size:11.5px;line-height:1.3;padding:5px 7px 7px;resize:none;overflow:hidden;outline:none;
  overflow-wrap:anywhere}

.foot{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;color:var(--ink-soft);font-size:12px}
@media (max-width:760px){.year b{font-size:32px}.brand svg{height:38px}.dn{padding:6px 5px 0}.dn b{font-size:12px}.dn i{font-size:8px}.d textarea{padding:5px 5px 7px}}
@media (prefers-reduced-motion:reduce){.status[data-s="saving"]::before{animation:none}}
</style>
</head>

<script>
/*CORE-START*/
var YEAR = 2027;
var MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];
var DOW = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
var DOW_LONG = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
var HM = ["Muharram","Safar","Rabi’ I","Rabi’ II","Jumada I","Jumada II","Rajab","Sha’ban","Ramadan","Shawwal","Dhu al-Qi’dah","Dhu al-Hijjah"];
var HM_SHORT = ["Muh","Saf","Rab I","Rab II","Jum I","Jum II","Raj","Sha","Ram","Shw","Qid","Hij"];
/* First Gregorian day of each Hijri month touching 2027 (Umm al-Qura): [y, m, d, hijriYear, hijriMonth] */
var HSTART = [
  [2026,12,10,1448,7],[2027,1,9,1448,8],[2027,2,8,1448,9],[2027,3,9,1448,10],[2027,4,8,1448,11],
  [2027,5,7,1448,12],[2027,6,6,1449,1],[2027,7,5,1449,2],[2027,8,3,1449,3],[2027,9,2,1449,4],
  [2027,10,1,1449,5],[2027,10,31,1449,6],[2027,11,29,1449,7],[2027,12,29,1449,8]
];
function dayNum(y,m,d){ return Math.round(Date.UTC(y,m-1,d)/86400000); }
function hijri(m,d){
  var n = dayNum(YEAR,m,d), i = HSTART.length-1;
  while(i>0 && dayNum(HSTART[i][0],HSTART[i][1],HSTART[i][2])>n) i--;
  var s = HSTART[i];
  return {y:s[3], m:s[4], d:n-dayNum(s[0],s[1],s[2])+1};
}
function daysIn(m){ return new Date(Date.UTC(YEAR,m,0)).getUTCDate(); }
function firstDow(m){ return new Date(Date.UTC(YEAR,m-1,1)).getUTCDay(); }
function hijriRange(m){
  var a = hijri(m,1), b = hijri(m,daysIn(m));
  if(a.m===b.m) return HM[a.m-1]+" "+a.y;
  if(a.y===b.y) return HM[a.m-1]+" – "+HM[b.m-1]+" "+a.y;
  return HM[a.m-1]+" "+a.y+" – "+HM[b.m-1]+" "+b.y;
}
function pad(n){ return (n<10?"0":"")+n; }
function monthKey(m){ return YEAR+"-"+pad(m); }

/* Builds the Excel workbook: one sheet, 3 x 4 months, same order and colours as the page. */
function buildWorkbook(ExcelJS, notes, logoPng){
  var NAVY="FF002657", BLUE="FF004EAA", SKY="FF62B6F3", HIJ="FF6F93C6", LINE="FFD9E2EE", WE="FFEEF6FD", SOFT="FF4A618A";
  var wb = new ExcelJS.Workbook();
  wb.creator = "Jeddah Airports"; wb.created = new Date(Date.UTC(2026,10,11));
  var ws = wb.addWorksheet("Calendar 2027", {
    views:[{showGridLines:false, zoomScale:80}],
    pageSetup:{paperSize:8, orientation:"landscape", fitToPage:true, fitToWidth:1, fitToHeight:1, horizontalCentered:true,
      margins:{left:0.3,right:0.3,top:0.3,bottom:0.3,header:0.1,footer:0.1}}
  });
  var COLW=17, c, r;
  ws.getColumn(1).width = 2;
  for(var b=0;b<3;b++){
    for(c=0;c<7;c++) ws.getColumn(2+b*8+c).width = COLW;
    ws.getColumn(2+b*8+7).width = 2;
  }
  var LAST = 24;
  function font(size,color,bold){ return {name:"Arial", size:size, bold:!!bold, color:{argb:color}}; }
  var thin = {style:"thin", color:{argb:LINE}};

  ws.getRow(1).height = 10; ws.getRow(2).height = 24; ws.getRow(3).height = 24; ws.getRow(4).height = 18; ws.getRow(5).height = 14;
  ws.mergeCells(2,18,3,LAST);
  var t = ws.getCell(2,18); t.value = "Calendar 2027"; t.font = font(28,NAVY,true);
  t.alignment = {horizontal:"right", vertical:"middle"};
  ws.mergeCells(4,18,4,LAST);
  var st = ws.getCell(4,18); st.value = "1448 – 1449 AH"; st.font = font(11,SOFT,false);
  st.alignment = {horizontal:"right", vertical:"middle"};
  if(logoPng){
    var img = wb.addImage({base64:logoPng, extension:"png"});
    ws.addImage(img, {tl:{col:1.05,row:1.15}, ext:{width:195, height:60}});
  }

  for(var m=1;m<=12;m++){
    var band = Math.floor((m-1)/3), blk = (m-1)%3;
    var c0 = 2+blk*8, r0 = 6+band*15;
    ws.getRow(r0).height = 28; ws.getRow(r0+1).height = 18; ws.getRow(r0+14).height = 14;
    ws.mergeCells(r0,c0,r0,c0+3);
    var h = ws.getCell(r0,c0); h.value = MONTHS[m-1]; h.font = font(16,NAVY,true);
    h.alignment = {horizontal:"left", vertical:"middle"};
    ws.mergeCells(r0,c0+4,r0,c0+6);
    var hr = ws.getCell(r0,c0+4); hr.value = hijriRange(m); hr.font = font(9,HIJ,false);
    hr.alignment = {horizontal:"right", vertical:"middle"};
    for(c=0;c<7;c++){
      ws.getCell(r0,c0+c).border = {bottom:{style:"medium", color:{argb:BLUE}}};
      var w = ws.getCell(r0+1,c0+c); w.value = DOW[c].toUpperCase();
      w.font = font(8,(c>=5?HIJ:BLUE),true); w.alignment = {horizontal:"left", vertical:"middle", indent:1};
    }
    var off = firstDow(m), n = daysIn(m), mnotes = (notes && notes[monthKey(m)]) || {};
    for(var wk=0;wk<6;wk++){
      var rd = r0+2+wk*2, rn = rd+1;
      var lines = 1;
      for(c=0;c<7;c++){
        var dd = wk*7+c-off+1, tx = (dd>=1&&dd<=n&&mnotes[dd]) ? String(mnotes[dd]) : "";
        if(tx){ var ln = 0; tx.split("\n").forEach(function(p){ ln += Math.max(1, Math.ceil(p.length/24)); }); if(ln>lines) lines = ln; }
      }
      ws.getRow(rd).height = 16; ws.getRow(rn).height = Math.max(ws.getRow(rn).height||0, 30, lines*10.5+6);
      for(c=0;c<7;c++){
        var d = wk*7+c-off+1;
        if(d<1||d>n) continue;
        var hj = hijri(m,d);
        var dc = ws.getCell(rd,c0+c), nc = ws.getCell(rn,c0+c);
        dc.value = {richText:[
          {text:String(d), font:font(11,NAVY,true)},
          {text:"   "+hj.d+(hj.d===1?" "+HM_SHORT[hj.m-1]:""), font:font(8,HIJ,false)}
        ]};
        dc.alignment = {horizontal:"left", vertical:"middle", indent:1};
        dc.border = {top:thin,left:thin,right:thin};
        nc.value = mnotes[d] ? String(mnotes[d]) : null;
        nc.font = font(8,NAVY,false);
        nc.alignment = {horizontal:"left", vertical:"top", wrapText:true, indent:1};
        nc.border = {left:thin,right:thin,bottom:thin};
        if(c>=5){
          dc.fill = {type:"pattern", pattern:"solid", fgColor:{argb:WE}};
          nc.fill = {type:"pattern", pattern:"solid", fgColor:{argb:WE}};
        }
      }
    }
  }
  var fr = 6+4*15;
  ws.getRow(fr).height = 16;
  ws.mergeCells(fr,2,fr,12);
  var f1 = ws.getCell(fr,2); f1.value = "Hijri dates follow the Umm al-Qura calendar."; f1.font = font(8,SOFT,false);
  f1.alignment = {horizontal:"left", vertical:"middle"};
  ws.mergeCells(fr,14,fr,LAST);
  var f2 = ws.getCell(fr,14); f2.value = "Designed by Mohammed Wagih · v1.0"; f2.font = font(8,SOFT,false);
  f2.alignment = {horizontal:"right", vertical:"middle"};
  ws.pageSetup.printArea = "A1:Y"+fr;
  return wb;
}

var LS_KEY = "ja-calendar-2027-notes";
var notes = {};           /* {"2027-01": {"5": "text"}} */
var dirty = {}, writing = {}, timers = {};
var db = null, readOnly = false, remoteOk = false;
var $ = function(id){ return document.getElementById(id); };

function loadLocal(){ try{ var s = localStorage.getItem(LS_KEY); if(s){ var o = JSON.parse(s); if(o && typeof o==="object") notes = o; } }catch(e){} }
function saveLocal(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(notes)); }catch(e){} }
function setStatus(s,text){ var el=$("status"); el.dataset.s=s; el.textContent=text; }
function refreshStatus(){
  var busy = Object.keys(dirty).some(function(k){return dirty[k]}) || Object.keys(writing).some(function(k){return writing[k]});
  if(readOnly) return setStatus("warn","View only. Changes stay on this device.");
  if(!db) return setStatus("ok", busy ? "Saving…" : "Saved on this device");
  if(busy) return setStatus("saving","Saving…");
  setStatus("ok", remoteOk ? "All notes saved" : "Ready");
}
function grow(ta){ ta.style.minHeight="0px"; ta.style.height="0px"; var h=ta.scrollHeight; ta.style.height=""; ta.style.minHeight=Math.max(42,h)+"px"; }

function render(){
  var host = $("months"), html = "";
  for(var m=1;m<=12;m++){
    var off = firstDow(m), n = daysIn(m), weeks = 6, key = monthKey(m);
    html += '<section class="month" aria-label="'+MONTHS[m-1]+' 2027"><div class="mh"><h2>'+MONTHS[m-1]+'</h2><span>'+hijriRange(m)+'</span></div><div class="dow">';
    for(var c=0;c<7;c++) html += '<span'+(c>=5?' class="we"':'')+'>'+DOW[c]+'</span>';
    html += '</div><div class="days">';
    for(var i=0;i<weeks*7;i++){
      var d = i-off+1, col = i%7;
      if(d<1||d>n){ html += '<div class="d off"></div>'; continue; }
      var hj = hijri(m,d);
      html += '<div class="d'+(col>=5?' we':'')+'"><div class="dn"><b>'+d+'</b><i title="'+hj.d+' '+HM[hj.m-1]+' '+hj.y+' AH">'+hj.d+(hj.d===1?'<em>'+HM_SHORT[hj.m-1]+'</em>':'')+'</i></div>'+
        '<textarea id="n-'+key+'-'+pad(d)+'" data-m="'+key+'" data-d="'+d+'" rows="1" spellcheck="false" aria-label="Notes for '+DOW_LONG[col]+', '+MONTHS[m-1]+' '+d+', 2027 ('+hj.d+' '+HM[hj.m-1]+' '+hj.y+' AH)"></textarea></div>';
    }
    html += '</div></section>';
  }
  host.innerHTML = html;
  fillAll(true);
}
function fillAll(force){
  var tas = document.querySelectorAll(".d textarea");
  for(var i=0;i<tas.length;i++){
    var ta = tas[i], v = (notes[ta.dataset.m]||{})[ta.dataset.d] || "";
    if(ta.value!==v && (force || document.activeElement!==ta)){ ta.value = v; }
  }
  growAll();
}
function growAll(){ var tas = document.querySelectorAll(".d textarea"); for(var i=0;i<tas.length;i++) grow(tas[i]); }

function onInput(e){
  var ta = e.target; if(!ta.dataset || !ta.dataset.m) return;
  var k = ta.dataset.m, d = ta.dataset.d, v = ta.value;
  if(!notes[k]) notes[k] = {};
  if(v.trim()==="") delete notes[k][d]; else notes[k][d] = v;
  grow(ta); saveLocal();
  dirty[k] = true; clearTimeout(timers[k]); timers[k] = setTimeout(function(){ flush(k); }, 800);
  refreshStatus();
}
function flush(k){
  if(!db || readOnly){ dirty[k] = false; refreshStatus(); return Promise.resolve(); }
  if(writing[k]) return Promise.resolve();
  if(!dirty[k]) return Promise.resolve();
  dirty[k] = false; writing[k] = true; refreshStatus();
  var body = {year:YEAR, month:Number(k.slice(5)), days:Object.assign({}, notes[k]||{})};
  return db.doc("notes/"+k).set(body).then(function(){
    writing[k] = false; remoteOk = true;
    if(dirty[k]) return flush(k);
    refreshStatus();
  }, function(err){
    writing[k] = false;
    if(err && err.code==="invalid_argument"){ readOnly = true; refreshStatus(); }
    else { dirty[k] = false; refreshStatus(); setStatus("warn","Couldn’t save online. Your notes are kept on this device."); }
  });
}
function applyRemote(k, data){
  if(dirty[k] || writing[k]) return;
  var days = (data && data.days && typeof data.days==="object") ? data.days : {}, clean = {};
  Object.keys(days).forEach(function(d){ if(typeof days[d]==="string" && days[d]!=="") clean[d] = days[d]; });
  notes[k] = clean;
}
function connect(){
  if(!(window.claude && window.claude.use)){ refreshStatus(); return; }
  window.claude.use("db").then(function(ns){
    if(!ns){ refreshStatus(); return; }
    db = ns;
    var local = JSON.parse(JSON.stringify(notes));
    var slow = setTimeout(function(){ if(!remoteOk) setStatus("warn","Can’t reach saved notes yet. Typing still works."); }, 10000);
    var first = true;
    db.collection("notes").onSnapshot(function(snap){
      if(snap.metadata && snap.metadata.fromCache && first) { /* wait for the confirmed copy before trusting an empty store */ }
      var seen = {};
      snap.docs.forEach(function(doc){ seen[doc.id] = true; applyRemote(doc.id, doc.data()); });
      if(!(snap.metadata && snap.metadata.fromCache)){
        clearTimeout(slow); remoteOk = true;
        if(first){
          first = false;
          /* notes typed on this device before the store existed are pushed up once */
          Object.keys(local).forEach(function(k){
            if(!seen[k] && local[k] && Object.keys(local[k]).length){ notes[k] = local[k]; dirty[k] = true; flush(k); }
          });
        } else {
          Object.keys(notes).forEach(function(k){ if(!seen[k] && !dirty[k] && !writing[k]) notes[k] = {}; });
        }
      }
      saveLocal(); fillAll(false); refreshStatus();
    }, function(){ clearTimeout(slow); setStatus("warn","Online saving is off. Your notes are kept on this device."); db = null; });
    refreshStatus();
  });
}

function setMsg(text, warn){ var el=$("msg"); el.textContent=text||""; el.dataset.s = warn?"warn":""; }
function exportExcel(){
  var btn = $("exportBtn"), lbl = $("exportLbl");
  if(typeof ExcelJS==="undefined"){ setMsg("The Excel tool didn’t load. Check your connection and reopen the page.", true); return; }
  btn.disabled = true; lbl.textContent = "Preparing…"; setMsg("");
  var done = function(){ btn.disabled = false; lbl.textContent = "Export to Excel"; };
  var wb;
  try{ wb = buildWorkbook(ExcelJS, notes, LOGO_PNG); }catch(e){ done(); setMsg("Couldn’t build the file. Try again.", true); return; }
  Promise.all([wb.xlsx.writeBuffer(), (window.claude && window.claude.use) ? window.claude.use("downloads") : Promise.resolve(null)])
  .then(function(res){
    var buf = res[0], dl = res[1];
    if(!dl && !window.claude){
      var u = URL.createObjectURL(new Blob([buf],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"}));
      var a = document.createElement("a"); a.href = u; a.download = "Jeddah-Airports-Calendar-2027.xlsx";
      document.body.appendChild(a); a.click(); a.remove(); setTimeout(function(){ URL.revokeObjectURL(u); }, 4000);
      setMsg("Excel file saved."); return;
    }
    if(!dl){ setMsg("Saving files isn’t available in this view. Open the calendar in Claude and try again.", true); return; }
    return dl.save({filename:"Jeddah-Airports-Calendar-2027.xlsx", data:new Blob([buf])}).then(function(){
      setMsg("Excel file saved.");
    }, function(err){
      if(err && err.code==="declined") setMsg("");
      else if(err && err.code==="rate_limited") setMsg("A save prompt is already open.", true);
      else setMsg("Couldn’t save the file here. Try again.", true);
    });
  }, function(){ setMsg("Couldn’t build the file. Try again.", true); })
  .then(done, done);
}

function start(){
  loadLocal(); render(); refreshStatus();
  $("months").addEventListener("input", onInput);
  $("exportBtn").addEventListener("click", exportExcel);
  var rt; window.addEventListener("resize", function(){ clearTimeout(rt); rt = setTimeout(growAll, 150); });
  if(document.fonts && document.fonts.ready) document.fonts.ready.then(growAll);
  window.addEventListener("pagehide", function(){ Object.keys(dirty).forEach(function(k){ if(dirty[k]){ clearTimeout(timers[k]); flush(k); } }); });
  connect();
}
start();
</script>
