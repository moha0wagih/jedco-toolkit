:root{--bg:#F3F6FA;--surface:#FFFFFF;--ink:#002657;--soft:#4A618A;--accent:#004EAA;--sky:#62B6F3;--line:#D9E2EE;--tint:#EEF6FD;
  --ns:#8E9AB0;--ip:#004EAA;--ot:#00B2BA;--ar:#FC5C17;--dl:#D93025;--ok:#0B8A43;--pur:#9C12F2;
  --display:"Sequel","Tajawal","Arial Black",Arial,sans-serif;--body:"FS Industrie","Tajawal",Arial,Helvetica,sans-serif;color-scheme:light}
*{box-sizing:border-box}
html{-webkit-print-color-adjust:exact;print-color-adjust:exact}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.6}
.num{font-family:var(--display)}
.wrap{max-width:980px;margin:0 auto;padding-block:0 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.hero{background:#002657;color:#fff;border-radius:0 0 22px 22px;padding:26px 28px 30px;display:flex;flex-direction:column;gap:18px;
  background-image:radial-gradient(900px 420px at 88% -20%,rgba(98,182,243,.28),transparent 60%)}
.htop{display:flex;justify-content:space-between;align-items:center;gap:12px}
.hero svg{height:38px;width:auto;fill:#fff;display:block}
.hero h1{font-family:var(--display);font-weight:700;font-size:clamp(24px,4.6vw,36px);margin:0;line-height:1.2;text-wrap:balance}
.hero p{margin:0;font-size:16px;opacity:.9;max-width:62ch}
.lang{border:1px solid rgba(255,255,255,.4);background:transparent;color:#fff;border-radius:10px;padding:7px 12px;font:inherit;font-size:13px;cursor:pointer}
.cta{display:flex;gap:10px;flex-wrap:wrap}
.cta a{display:inline-block;border-radius:11px;padding:10px 16px;font-size:14px;text-decoration:none;background:#fff;color:#002657}
.cta a.alt{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.5)}
h2{font-family:var(--display);font-weight:700;font-size:19px;margin:30px 0 12px;display:flex;align-items:center;gap:10px}
h2::before{content:"";width:12px;height:12px;border-radius:50%;background:var(--c,var(--accent));flex:none}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px;border-top:4px solid var(--c,var(--accent));min-width:0}
.card b{display:block;font-size:15.5px;margin-bottom:3px}
.card span{color:var(--soft);font-size:13.5px}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;counter-reset:s}
.step{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px;min-width:0}
.step i{font-style:normal;font-family:var(--display);font-weight:700;font-size:22px;color:var(--accent);display:block;line-height:1.1;margin-bottom:6px}
.step b{display:block}
.step span{color:var(--soft);font-size:13.5px}
.how{display:flex;flex-direction:column;gap:8px}
.how div{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 16px;display:grid;grid-template-columns:minmax(120px,210px) minmax(0,1fr);gap:6px 18px;align-items:baseline}
.how b{color:var(--accent)}
.how span{color:var(--ink)}
.legend{display:flex;flex-wrap:wrap;gap:10px}
.legend div{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 14px;display:flex;align-items:center;gap:10px;flex:1 1 260px;min-width:0}
.pill{border-radius:999px;padding:4px 12px;font-size:13px;white-space:nowrap;background:var(--c);color:#fff;flex:none}
.pill.dk{color:#00142F}.pill.ns{background:#DDE1E8;color:var(--ink)}
.pill.glow{box-shadow:0 0 12px 1px rgba(217,48,37,.6)}
.legend span:last-child{color:var(--soft);font-size:13.5px}
.note{background:var(--tint);border:1px solid var(--line);border-radius:16px;padding:14px 16px}
.note b{color:var(--accent)}
.foot{margin-top:28px;color:var(--soft);font-size:12.5px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.url{direction:ltr;unicode-bidi:isolate;font-size:13.5px;word-break:break-all}
html[dir="rtl"] body{font-size:16px}
@media (max-width:600px){.how div{grid-template-columns:minmax(0,1fr)}.hero{padding:20px 18px 24px}}
@media print{body{background:#fff;font-size:12.5px}html[dir="rtl"] body{font-size:13px}.lang,.cta{display:none}.wrap{max-width:none;padding:0}.hero{border-radius:16px}
  h2{margin:16px 0 8px;font-size:15px}.card,.step,.how div,.legend div,.note{break-inside:avoid;padding:9px 12px}.grid,.steps{gap:8px}.how{gap:6px}
  .hero h1{font-size:24px}.hero p{font-size:13.5px}.hero{padding:18px 22px;gap:10px}
  .grid,.steps{grid-template-columns:repeat(4,minmax(0,1fr))}.legend div{flex:1 1 30%}.how div{grid-template-columns:150px minmax(0,1fr)}h2{break-after:avoid}}
@page{size:A4;margin:11mm}
</style>
</head>

<script>
"use strict";
var G = {
ar:{dir:"rtl", btn:"English", title:"دليل استخدام CCPR Tracker", lead:"مكان واحد لكل مهام ومشاريع التواصل المؤسسي. أي تحديث تسويه يظهر عند الفريق كله في نفس اللحظة.",
  open:"افتح التراكر", demo:"جرّب النسخة التجريبية",
  s:[
  {h:"ايش يعطيك التراكر", c:"var(--accent)", type:"grid", items:[
    ["لايف للجميع","أي تغيير يظهر فوراً عند كل الفريق، بدون إرسال ملفات.","var(--accent)"],
    ["ألوان تفهمها بنظرة","كل حالة لها لون، والمتأخر يوهج بالأحمر.","var(--dl)"],
    ["مهامي بضغطة","زر «مهامي» يعرض شغلك أنت فقط.","var(--ot)"],
    ["صور وأسماء الفريق","تعرف مين المسؤول عن كل مهمة من صورته.","var(--pur)"],
    ["تعليقات وسجل","اكتب تعليق على المهمة وشوف مين غيّر ايش ومتى.","var(--ar)"],
    ["تقويم","كل تواريخ التسليم في تقويم شهري واحد.","var(--sky)"],
    ["عربي وإنجليزي","بدّل لغة الواجهة من الزر فوق.","var(--accent)"],
    ["جوال وكمبيوتر","يشتغل من أي متصفح، وتقدر تصدّر Excel.","var(--ok)"]]},
  {h:"كيف تبدأ", c:"var(--ot)", type:"steps", items:[
    ["افتح الرابط","من الكمبيوتر أو الجوال."],
    ["أنشئ حساب","اضغط «إنشاء حساب» واكتب اسمك الكامل وإيميلك وكلمة مرور من 8 خانات أو أكثر."],
    ["انتظر الموافقة","المشرف يوافق على حسابك، وبعدها تدخل تلقائياً."],
    ["ابدأ","تفتح لك صفحة «المهام» مباشرة."]]},
  {h:"كيف تستخدمه", c:"var(--pur)", type:"how", items:[
    ["تشوف مهامك","اضغط «مهامي» في الشريط الملوّن فوق القائمة."],
    ["تغيّر حالة مهمة","اضغط على الحالة الملوّنة في نفس السطر واختر الحالة الجديدة."],
    ["تضيف مهمة","اضغط «مهمة جديدة»، اكتب الاسم، واختر التاريخ والفريق."],
    ["تضيف أشخاص","افتح المهمة أو المشروع، اضغط «إضافة شخص» واختر من القائمة أو اكتب الاسم واضغط Enter."],
    ["تكتب تحديث","افتح المهمة واكتب في «ملاحظات المتابعة»، أو أرسل تعليق تحتها."],
    ["تبحث وتفلتر","اكتب في خانة البحث، أو اضغط على أي لون في الشريط (مثلاً «متأخرة»)."],
    ["تخفي فريق","اضغط على اسم الفريق عشان تطوي مهامه أو تفتحها."],
    ["تشوف كل الخانات","زر «تفاصيل أكثر» يظهر الأولوية، الفرق المشاركة، البورد، والداشبورد."],
    ["المشاريع و T4","لها تبويبات فوق، وتشتغل بنفس الطريقة."],
    ["تقرير تنفيذي","زر «تقرير تنفيذي» يعطيك صفحة واحدة موجزة للاجتماعات، وتحفظها PDF."],
    ["الوضع الداكن","زر الشمس أو القمر فوق يبدّل بين الفاتح والداكن."]]},
  {h:"ألوان الحالات", c:"var(--dl)", type:"legend", items:[
    ["لم تبدأ","ns","ما بدأ العمل عليها."],["قيد التنفيذ","ip","العمل جاري."],["على المسار","ot dk","ماشية حسب الخطة."],
    ["في خطر","ar dk","فيه شي ممكن يأخرها."],["متأخرة","dl glow","تأخرت، وتوهج بالأحمر."],["مكتملة","ok","خلصت."]]},
  {h:"مين يقدر يعدّل", c:"var(--ar)", type:"note", items:[
    ["العضو","يعدّل المهام اللي هو عليها أو اللي أنشأها، ويقرأ ويعلّق على الباقي."],
    ["الأدمن","يعدّل كل شي ويوافق على الحسابات الجديدة."],
    ["لو حذفت مهمة بالغلط","ما تضيع. بلّغ الأدمن ويرجعها من تبويب «الفريق»."],
    ["نسيت كلمة المرور","اكتب إيميلك في صفحة الدخول واضغط «نسيت كلمة المرور؟»."],
    ["تبغى تجرب بدون خوف","افتح النسخة التجريبية. كل شي فيها وهمي وما ينحفظ ولا يشوفه أحد، وتقدر تشوفها كمدير أو كمستخدم."]]}
  ]},
en:{dir:"ltr", btn:"العربية", title:"CCPR Tracker guide", lead:"One place for every Corporate Communication task and project. Any update you make shows for the whole team at the same moment.",
  open:"Open the tracker", demo:"Try the demo",
  s:[
  {h:"What you get", c:"var(--accent)", type:"grid", items:[
    ["Live for everyone","Every change shows for the whole team at once. No files to send.","var(--accent)"],
    ["Colours you read at a glance","Each status has a colour, and delayed work glows red.","var(--dl)"],
    ["Your tasks in one click","The Mine button shows only your work.","var(--ot)"],
    ["Team photos and names","See who owns each task by their photo.","var(--pur)"],
    ["Comments and history","Comment on a task and see who changed what, and when.","var(--ar)"],
    ["Calendar","All due dates in one monthly calendar.","var(--sky)"],
    ["Arabic and English","Switch the interface language from the button at the top.","var(--accent)"],
    ["Phone and computer","Works in any browser, and exports to Excel.","var(--ok)"]]},
  {h:"Getting started", c:"var(--ot)", type:"steps", items:[
    ["Open the link","On a computer or a phone."],
    ["Create an account","Choose Create account and enter your full name, email and a password of 8 characters or more."],
    ["Wait for approval","An admin approves your account, then you get in automatically."],
    ["Start","The Tasks page opens straight away."]]},
  {h:"How to use it", c:"var(--pur)", type:"how", items:[
    ["See your tasks","Choose Mine in the coloured bar above the list."],
    ["Change a status","Click the coloured status on the task row and pick the new one."],
    ["Add a task","Choose New task, type the name, then pick the date and team."],
    ["Add people","Open the task or project, choose Add person, then pick from the list or type a name and press Enter."],
    ["Write an update","Open the task and type in Follow-up notes, or send a comment below it."],
    ["Search and filter","Type in the search box, or click any colour in the bar (Delayed, for example)."],
    ["Hide a team","Click a team name to fold or unfold its tasks."],
    ["See every field","More details shows priority, involved teams, the board and the dashboard."],
    ["Projects and T4","They have their own tabs and work the same way."],
    ["Executive report","Executive report gives a one-page summary for meetings that you can save as a PDF."],
    ["Dark mode","The sun or moon button at the top switches between light and dark."]]},
  {h:"Status colours", c:"var(--dl)", type:"legend", items:[
    ["Not Started","ns","Work hasn’t begun."],["In Progress","ip","Work is under way."],["On Track","ot dk","Going to plan."],
    ["At Risk","ar dk","Something may delay it."],["Delayed","dl glow","It is late, and it glows red."],["Completed","ok","Done."]]},
  {h:"Who can edit", c:"var(--ar)", type:"note", items:[
    ["Members","Edit the tasks they are on or created, and can read and comment on the rest."],
    ["Admins","Edit everything and approve new accounts."],
    ["Deleted a task by mistake","It isn’t lost. Tell an admin and they restore it from the Team tab."],
    ["Forgot your password","Type your email on the sign-in page and choose Forgot your password?"],
    ["Want to try safely","Open the demo. Everything there is sample data that is never saved or seen by anyone, and you can view it as a manager or as a member."]]}
  ]}
};
function esc(s){ return String(s).replace(/[&<>"]/g,function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }
var LANG = (function(){ var m = location.search.match(/[?&]lang=(ar|en)/); if(m) return m[1]; try{ var l = localStorage.getItem("trk-lang"); if(l==="ar"||l==="en") return l; }catch(e){} return "ar"; })();
function draw(){
  var g = G[LANG], h = document.documentElement; h.lang = LANG; h.dir = g.dir;
  document.getElementById("lang").textContent = g.btn; document.getElementById("t_title").textContent = g.title; document.getElementById("t_lead").textContent = g.lead;
  document.getElementById("a_open").textContent = g.open; document.getElementById("a_demo").textContent = g.demo; document.title = g.title;
  document.getElementById("main").innerHTML = g.s.map(function(s){
    var b = "";
    if(s.type==="grid") b = '<div class="grid">'+s.items.map(function(x){ return '<div class="card" style="--c:'+x[2]+'"><b>'+esc(x[0])+'</b><span>'+esc(x[1])+'</span></div>'; }).join("")+'</div>';
    else if(s.type==="steps") b = '<div class="steps">'+s.items.map(function(x,i){ return '<div class="step"><i>'+(i+1)+'</i><b>'+esc(x[0])+'</b><span>'+esc(x[1])+'</span></div>'; }).join("")+'</div>';
    else if(s.type==="how") b = '<div class="how">'+s.items.map(function(x){ return '<div><b>'+esc(x[0])+'</b><span>'+esc(x[1])+'</span></div>'; }).join("")+'</div>';
    else if(s.type==="legend") b = '<div class="legend">'+s.items.map(function(x){ var k = x[1].split(" "); return '<div><span class="pill '+k.slice(1).join(" ")+(k[0]==="ns"?" ns":"")+'" style="--c:var(--'+k[0]+')">'+esc(x[0])+'</span><span>'+esc(x[2])+'</span></div>'; }).join("")+'</div>';
    else b = '<div class="how">'+s.items.map(function(x){ return '<div><b>'+esc(x[0])+'</b><span>'+esc(x[1])+'</span></div>'; }).join("")+'</div>';
    return '<section><h2 style="--c:'+s.c+'">'+esc(s.h)+'</h2>'+b+'</section>'; }).join("");
}
document.getElementById("lang").addEventListener("click", function(){ LANG = LANG==="ar" ? "en" : "ar"; try{ localStorage.setItem("trk-lang", LANG); }catch(e){} draw(); });
draw();
</script>
